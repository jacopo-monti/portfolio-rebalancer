name: Deploy to Hugging Face Spaces

# Manual deployment only - no automatic triggers
# This prevents accidental deploys and conserves Actions quota
on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: 'Type "deploy" to confirm deployment to Hugging Face'
        required: true
        type: string

jobs:
  deploy-to-huggingface:
    name: Deploy to HF Spaces
    runs-on: ubuntu-latest
    
    # Only run if user confirmed deployment
    if: github.event.inputs.confirm_deploy == 'deploy'
    
    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for proper git operations
      
      - name: 🔍 Validate configuration
        id: validate
        run: |
          # Check if HF_TOKEN secret exists
          if [ -z "${{ secrets.HF_TOKEN }}" ]; then
            echo "❌ ERROR: HF_TOKEN secret not configured"
            echo "Please add HF_TOKEN to repository secrets"
            exit 1
          fi
          
          # Get HF configuration from repository variables or use defaults
          HF_USERNAME="${{ vars.HF_USERNAME }}"
          HF_SPACE_NAME="${{ vars.HF_SPACE_NAME }}"
          
          # If variables not set, provide clear instructions
          if [ -z "$HF_USERNAME" ] || [ -z "$HF_SPACE_NAME" ]; then
            echo "⚠️ WARNING: HF_USERNAME or HF_SPACE_NAME not set in repository variables"
            echo "Using hardcoded fallback values (update repository variables for production)"
            HF_USERNAME="Jacmon"
            HF_SPACE_NAME="Portfolio-rebalancer"
          fi
          
          echo "hf_username=$HF_USERNAME" >> $GITHUB_OUTPUT
          echo "hf_space_name=$HF_SPACE_NAME" >> $GITHUB_OUTPUT
          echo "hf_repo_url=https://huggingface.co/spaces/$HF_USERNAME/$HF_SPACE_NAME" >> $GITHUB_OUTPUT
          
          echo "✅ Configuration validated:"
          echo "   - HF Username: $HF_USERNAME"
          echo "   - HF Space: $HF_SPACE_NAME"
          echo "   - Target URL: https://huggingface.co/spaces/$HF_USERNAME/$HF_SPACE_NAME"
      
      - name: 📝 Prepare Hugging Face version
        run: |
          echo "🛠️ Preparing HF-compatible repository version..."
          
          # Verify README_HF.md exists
          if [ ! -f "README_HF.md" ]; then
            echo "❌ ERROR: README_HF.md not found"
            echo "This file is required for Hugging Face deployment"
            exit 1
          fi
          
          # Remove GitHub-specific README
          echo "  ➡️ Removing GitHub README.md"
          rm -f README.md
          
          # Rename Hugging Face README to README.md
          echo "  ➡️ Renaming README_HF.md to README.md"
          mv README_HF.md README.md
          
          # Verify the swap was successful
          if [ ! -f "README.md" ]; then
            echo "❌ ERROR: Failed to create README.md from README_HF.md"
            exit 1
          fi
          
          # Show first few lines to verify content
          echo "✅ README.md prepared successfully"
          echo "  First 5 lines:"
          head -n 5 README.md | sed 's/^/    /'
          
          # List files that will be deployed
          echo ""
          echo "📦 Files ready for deployment:"
          ls -lh | grep -E '(app.py|requirements.txt|README.md|pyproject.toml|setup.py)' | sed 's/^/  /'
      
      - name: 🔑 Configure git credentials
        env:
          HF_USERNAME: ${{ steps.validate.outputs.hf_username }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          echo "🔧 Configuring git for Hugging Face..."
          
          # Set git user (required for commits)
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "GitHub Actions Bot"
          
          # Configure git credential helper to use token
          git config --global credential.helper store
          
          echo "✅ Git configured successfully"
      
      - name: 🚀 Deploy to Hugging Face Spaces
        env:
          HF_USERNAME: ${{ steps.validate.outputs.hf_username }}
          HF_SPACE_NAME: ${{ steps.validate.outputs.hf_space_name }}
          HF_REPO_URL: ${{ steps.validate.outputs.hf_repo_url }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          echo "🚀 Deploying to Hugging Face Spaces..."
          echo "   Target: $HF_REPO_URL"
          
          # Commit the README changes
          git add -A
          git commit -m "deploy: Update from GitHub (automated deployment)
          
          Deployed from: ${{ github.repository }}
          Commit: ${{ github.sha }}
          Workflow: ${{ github.workflow }}
          Triggered by: ${{ github.actor }}
          Timestamp: $(date -u +'%Y-%m-%d %H:%M:%S UTC')
          
          Changes:
          - Swapped README.md with Hugging Face version
          - All application code synchronized
          " || echo "No changes to commit"
          
          # Push to Hugging Face with force (to handle README swap)
          echo "📤 Pushing to Hugging Face..."
          git push --force https://$HF_USERNAME:$HF_TOKEN@huggingface.co/spaces/$HF_USERNAME/$HF_SPACE_NAME main
          
          if [ $? -eq 0 ]; then
            echo ""
            echo "✅✅✅ DEPLOYMENT SUCCESSFUL! ✅✅✅"
            echo ""
            echo "Your app is deploying at:"
            echo "  🌐 $HF_REPO_URL"
            echo ""
            echo "Next steps:"
            echo "  1. Wait 1-2 minutes for Hugging Face to rebuild the Space"
            echo "  2. Visit the URL above to verify deployment"
            echo "  3. Check Space logs if there are any issues"
            echo ""
          else
            echo "❌ DEPLOYMENT FAILED"
            echo "Check the error messages above for details"
            exit 1
          fi
      
      - name: 📢 Deployment summary
        if: always()
        run: |
          echo ""
          echo "====================================="
          echo "     DEPLOYMENT SUMMARY"
          echo "====================================="
          echo ""
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Actor: ${{ github.actor }}"
          echo ""
          echo "HF Username: ${{ steps.validate.outputs.hf_username }}"
          echo "HF Space: ${{ steps.validate.outputs.hf_space_name }}"
          echo "HF URL: ${{ steps.validate.outputs.hf_repo_url }}"
          echo ""
          echo "Status: ${{ job.status }}"
          echo "====================================="

  # This job only runs if confirmation was not provided
  deployment-cancelled:
    name: Deployment Cancelled
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm_deploy != 'deploy'
    
    steps:
      - name: ❌ Deployment cancelled
        run: |
          echo "❌ DEPLOYMENT CANCELLED"
          echo ""
          echo "You must type 'deploy' in the confirmation field to proceed."
          echo "You entered: '${{ github.event.inputs.confirm_deploy }}'"
          echo ""
          echo "To deploy to Hugging Face Spaces:"
          echo "  1. Go to Actions > Deploy to Hugging Face Spaces"
          echo "  2. Click 'Run workflow'"
          echo "  3. Type 'deploy' in the confirmation field"
          echo "  4. Click 'Run workflow' button"
          echo ""
          exit 1
