name: Tests

# Manual execution only to conserve GitHub Actions quota
# Previously ran on every push/PR with 15 parallel jobs (3 OS × 5 Python versions)
on:
  workflow_dispatch:
    inputs:
      python-versions:
        description: 'Python versions to test (comma-separated, e.g., "3.10,3.11")'
        required: false
        default: '3.8,3.9,3.10,3.11,3.12'
        type: string
      os-platforms:
        description: 'OS platforms to test (comma-separated)'
        required: false
        default: 'ubuntu-latest,macos-latest,windows-latest'
        type: string

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(format('[{0}]', inputs.os-platforms || 'ubuntu-latest,macos-latest,windows-latest')) }}
        python-version: ${{ fromJson(format('[{0}]', inputs.python-versions || '3.8,3.9,3.10,3.11,3.12')) }}
    
    name: Test on ${{ matrix.os }} with Python ${{ matrix.python-version }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    
    - name: Run tests with coverage
      run: |
        pytest --cov=portfolio_rebalancer --cov-report=xml --cov-report=term-missing --verbose
    
    - name: Upload coverage to Codecov
      if: success()
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests-${{ matrix.os }}-py${{ matrix.python-version }}
        name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}
        fail_ci_if_error: false

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
    - name: Check test results
      run: |
        if [ "${{ needs.test.result }}" = "success" ]; then
          echo "✅ All tests passed successfully!"
        else
          echo "❌ Some tests failed. Check the test job for details."
          exit 1
        fi
