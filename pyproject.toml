[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-rebalancer"
version = "0.3.1"
description = "A deterministic tool for portfolio rebalancing with tax-aware calculations"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Dual License: AGPL-3.0 (open source) OR Commercial (see LICENSE-COMMERCIAL.md)"}
authors = [
    {name = "Jacopo Monti", email = "jacopo.monti.jm@gmail.com"},
]
keywords = [
    "portfolio",
    "rebalancing",
    "finance",
    "investment",
    "tax-aware",
    "deterministic",
    "agpl",
    "open-source",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Operating System :: OS Independent",
    "Environment :: Web Environment",
    "Framework :: Streamlit",
]

dependencies = [
    "openpyxl>=3.0.0",
    "streamlit>=1.28.0",
    "pandas>=1.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "flake8>=6.0",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://github.com/jacopo-monti/portfolio-rebalancer"
Repository = "https://github.com/jacopo-monti/portfolio-rebalancer"
Issues = "https://github.com/jacopo-monti/portfolio-rebalancer/issues"
"Commercial License" = "https://github.com/jacopo-monti/portfolio-rebalancer/blob/main/LICENSE-COMMERCIAL.md"
Documentation = "https://github.com/jacopo-monti/portfolio-rebalancer/tree/main/docs"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
