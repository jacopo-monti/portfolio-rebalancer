# Streamlit configuration for Portfolio Rebalancer
# Optimized for Hugging Face Spaces deployment

[server]
# Disable CORS for Hugging Face Spaces
enableCORS = false
# Enable WebSocket compression for better performance
enableWebsocketCompression = true
# Set max upload size (MB)
maxUploadSize = 50
# Disable XSRF protection (handled by Hugging Face)
enableXsrfProtection = false
# Server address
address = "0.0.0.0"
port = 7860

[browser]
# Disable automatic opening of browser (not applicable in Spaces)
gatherUsageStats = false
serverAddress = "0.0.0.0"
serverPort = 7860

[theme]
# Use default Streamlit theme for consistency
primaryColor = "#4CAF50"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0F2F6"
textColor = "#262730"
font = "sans serif"
