# Streamlit configuration for Portfolio Rebalancer
# Optimized for both local development and Hugging Face Spaces deployment

[server]
# Use localhost for local development
# Hugging Face containers automatically bind to 0.0.0.0 regardless of this setting
address = "localhost"
port = 7860

# Disable CORS for Hugging Face Spaces
enableCORS = false

# Enable WebSocket compression for better performance
enableWebsocketCompression = true

# Set max upload size (MB)
maxUploadSize = 50

# Disable XSRF protection (handled by Hugging Face)
enableXsrfProtection = false

[browser]
# Disable automatic opening of browser (not applicable in Spaces)
gatherUsageStats = false

[theme]
# Use default Streamlit theme for consistency
primaryColor = "#4CAF50"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0F2F6"
textColor = "#262730"
font = "sans serif"
